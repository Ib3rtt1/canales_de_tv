{% extends "base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}

<div class="container mt-5" style="max-width:500px;">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="text-center mb-4">

                Iniciar sesión

            </h2>

            {% if error %}

            <div class="alert alert-danger">

                {{ error }}

            </div>

            {% endif %}

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">

                    <label>Usuario</label>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        required>

                </div>

                <div class="mb-3">

                    <label>Contraseña</label>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required>

                </div>

                <button
                    class="btn btn-primary w-100">

                    Entrar

                </button>

            </form>

            <hr>

            <div class="text-center">

                ¿No tienes cuenta?

                <a href="{% url 'register' %}">

                    Crear cuenta

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
