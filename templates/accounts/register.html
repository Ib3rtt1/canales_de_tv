{% extends "base.html" %}

{% block title %}Crear cuenta{% endblock %}

{% block content %}

<div class="container mt-5" style="max-width:500px;">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="text-center mb-4">
                Crear cuenta
            </h2>

            {% if errors %}
            <div class="alert alert-danger">
                <ul class="mb-0">
                    {% for error in errors %}
                    <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
            {% endif %}

            <form method="post">

                {% csrf_token %}

                <div class="mb-3">
                    <label>Usuario</label>
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        value="{{ username|default:'' }}"
                        required>
                </div>

                <div class="mb-3">
                    <label>Correo (opcional)</label>
                    <input
                        type="email"
                        name="email"
                        class="form-control"
                        value="{{ email|default:'' }}">
                </div>

                <div class="mb-3">
                    <label>Contraseña</label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label>Repetir contraseña</label>
                    <input
                        type="password"
                        name="password2"
                        class="form-control"
                        required>
                </div>

                <button class="btn btn-primary w-100">
                    Crear cuenta
                </button>

            </form>

            <hr>

            <div class="text-center">
                ¿Ya tienes cuenta?
                <a href="{% url 'login' %}">Iniciar sesión</a>
            </div>

        </div>

    </div>

</div>

{% endblock %}
