{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>
        {% block title %}TV Online{% endblock %}
    </title>

    <!-- Fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <!-- Bootstrap (grid y utilidades; los componentes visuales se
         re-skinnean con nuestro propio CSS) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS propio (variables / base / navbar / hero / sidebar / cards / footer / player / animations / responsive) -->
    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

    {% block css %}
    {% endblock %}

</head>

<body>

{% include "guia_tv/components/navbar.html" %}

<main>

    {% block content %}
    {% endblock %}

</main>

{% include "guia_tv/components/footer.html" %}

{% block javascript %}
{% endblock %}

<script>

/* Menú móvil */
const navToggle = document.getElementById("navToggle");
const navCollapse = document.getElementById("tvNavCollapse");

if (navToggle && navCollapse) {
    navToggle.addEventListener("click", function () {
        const isOpen = navCollapse.classList.toggle("is-open");
        navToggle.setAttribute("aria-expanded", isOpen);
    });
}

const searchBox = document.getElementById("search-box");
const searchResults = document.getElementById("search-results");

if (searchBox && searchResults) {

    let searchTimeout;

    searchBox.addEventListener("input", function () {

        const q = this.value.trim();
        clearTimeout(searchTimeout);

        if (q.length < 2) {
            searchResults.classList.remove("is-open");
            return;
        }

        searchTimeout = setTimeout(async () => {

            const response = await fetch(`/buscar/?q=${encodeURIComponent(q)}`);
            const data = await response.json();

            // Los nombres/países vienen de playlists M3U de terceros
            // (no confiables), así que se construyen los nodos con
            // textContent en vez de insertar HTML crudo -> evita XSS.
            searchResults.innerHTML = "";

            if (!data.length) {
                const empty = document.createElement("div");
                empty.className = "tv-search__empty";
                empty.textContent = `Sin resultados para "${q}"`;
                searchResults.appendChild(empty);
                searchResults.classList.add("is-open");
                return;
            }

            data.forEach((channel) => {
                const item = document.createElement("a");
                item.className = "tv-search__item";
                // channel.slug lo genera Django (slugify) y es seguro
                // para ir en la URL, pero igual se codifica por si acaso.
                item.href = `/canal/${encodeURIComponent(channel.slug)}/`;

                const thumb = document.createElement("span");
                thumb.className = "tv-search__thumb";

                if (channel.logo) {
                    const img = document.createElement("img");
                    img.src = channel.logo;
                    img.alt = "";
                    thumb.appendChild(img);
                } else {
                    const icon = document.createElement("i");
                    icon.className = "bi bi-tv";
                    thumb.appendChild(icon);
                }

                const meta = document.createElement("span");
                meta.className = "tv-search__meta";

                const name = document.createElement("span");
                name.className = "name";
                name.textContent = channel.name;

                const country = document.createElement("span");
                country.className = "country";
                country.textContent = channel.country || "";

                meta.append(name, country);
                item.append(thumb, meta);
                searchResults.appendChild(item);
            });

            searchResults.classList.add("is-open");

        }, 200);

    });

    document.addEventListener("click", function (event) {
        if (!event.target.closest(".tv-search")) {
            searchResults.classList.remove("is-open");
        }
    });
}

/* Flechas de los rieles horizontales de canales */
document.querySelectorAll(".rail__arrow").forEach(function (btn) {

    btn.addEventListener("click", function () {

        const track = btn.closest(".rail").querySelector(".rail__track");
        const amount = track.clientWidth * 0.8;

        track.scrollBy({
            left: btn.dataset.dir === "prev" ? -amount : amount,
            behavior: "smooth"
        });

    });

});

</script>

</body>

</html>
