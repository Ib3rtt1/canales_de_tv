<section class="hero rounded-4 mb-5">

    <div class="container py-5">

        <div class="row align-items-center">

            <div class="col-lg-7">

                {% if hero_channel %}

                    <span class="badge bg-danger mb-3">
                        EN VIVO
                    </span>

                    <h1 class="display-4 fw-bold">
                        {{ hero_channel.name }}
                    </h1>

                    <p class="lead">

                        {{ hero_channel.description|default:"Canal disponible en vivo." }}

                    </p>

                    <div class="mt-4">

                        <a href="{% url 'player' hero_channel.slug %}"
                           class="btn btn-danger btn-lg">

                            ▶ Ver ahora

                        </a>

                    </div>

                {% else %}

                    <h1 class="display-4">

                        TV Online

                    </h1>

                    <p>

                        Miles de canales IPTV gratuitos.

                    </p>

                {% endif %}

            </div>

            <div class="col-lg-5 text-center">

                {% if hero_channel.logo %}

                    <img
                        src="{{ hero_channel.logo.url }}"
                        class="img-fluid"
                        style="max-height:300px;">

                {% else %}

                    <i class="bi bi-broadcast display-1 text-danger"></i>

                {% endif %}

            </div>

        </div>

    </div>

</section>
