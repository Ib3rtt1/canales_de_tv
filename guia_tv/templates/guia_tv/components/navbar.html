<nav class="tv-navbar">

    <div class="container">

        <div class="tv-navbar__inner">

            <a class="tv-brand" href="{% url 'home' %}">

                <svg class="tv-brand__mark" viewBox="0 0 24 24" width="30" height="30" fill="none" aria-hidden="true">
                    <circle cx="12" cy="17" r="2.3" fill="currentColor"/>
                    <path d="M7.5 13.4a6.5 6.5 0 0 1 9 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <path d="M4.3 10a11 11 0 0 1 15.4 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".5"/>
                </svg>

                TV<span class="tv-brand__zap">Online</span>

            </a>

            <button
                id="navToggle"
                class="tv-navbar-toggler"
                type="button"
                aria-controls="tvNavCollapse"
                aria-expanded="false"
                aria-label="Abrir menú">

                <svg viewBox="0 0 24 24" fill="none" width="18" height="18">
                    <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>

            </button>

            <div class="tv-navbar__collapse" id="tvNavCollapse">

                <ul class="tv-nav-links">

                    <li><a href="{% url 'home' %}">Inicio</a></li>
                    <li><a href="{% url 'home' %}#destacados">Destacados</a></li>
                    <li><a href="{% url 'home' %}#categorias">Categorías</a></li>

                    {% if user.is_authenticated and user.is_staff %}
                        <li><a href="{% url 'dashboard' %}">Dashboard</a></li>
                    {% endif %}

                </ul>

                <div class="tv-search">

                    <svg class="tv-search__icon" viewBox="0 0 24 24" width="15" height="15" fill="none" aria-hidden="true">
                        <circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.8"/>
                        <path d="M20 20l-3.8-3.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    </svg>

                    <input
                        id="search-box"
                        type="search"
                        placeholder="Buscar canales..."
                        autocomplete="off">

                    <div id="search-results" class="tv-search__results"></div>

                </div>

                <div class="tv-user">

                    {% if user.is_authenticated %}

                        <span class="tv-user__name">
                            Hola, {{ user.username }}
                        </span>

                        <a href="{% url 'logout' %}" class="btn-ghost btn-sm">
                            Cerrar sesión
                        </a>

                    {% else %}

                        <a href="{% url 'login' %}" class="btn-signal btn-sm">
                            Iniciar sesión
                        </a>

                    {% endif %}

                </div>

            </div>

        </div>

    </div>

</nav>
